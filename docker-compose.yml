services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    # No ports published: only the backend talks to the database, inside
    # Docker's network. For a SQL shell: docker compose exec db psql -U tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      # "db" is the service name above; Docker's network resolves it to the DB container
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # optional: one idle timeout for all pages (e.g. 15 for testing).
      # Empty = per-page defaults from ws.js (home 2 min, articles and stats 5 min)
      IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-}
    # Published only for local development (npm run dev, requests.http);
    # the app itself reaches the backend through nginx.
    # BACKEND_PORT changes the port if 3000 is already taken on your machine.
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # The app: open http://localhost:8080. nginx forwards /api and /ws to the backend.
    # FRONTEND_PORT changes the port if 8080 is already taken on your machine.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
