# nginx serves the built React app and forwards /api and /ws to the backend.
# The browser only ever talks to this one origin, so the login cookie works
# without any CORS setup (the same job Vite's proxy does in development).
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # REST API. "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: the connection starts as HTTP and asks to "upgrade".
    # nginx doesn't pass those headers on by itself, so set them explicitly.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # nginx closes connections that are quiet for 60 s by default. The
        # server pings every 10 s, but allow more in case a ping is late.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router handles /articles, /stats... in the browser. Any URL that
    # isn't a real file gets index.html, so refreshing those pages works.
    location / {
        try_files $uri /index.html;
    }

    # Built files have a content hash in their name, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
